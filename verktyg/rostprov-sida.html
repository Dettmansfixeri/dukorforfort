<!doctype html>
<html lang="sv"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Röstbibliotek</title>
<style>
body{background:#111;color:#eee;font-family:system-ui,sans-serif;margin:0;padding:16px 16px 170px;max-width:1400px}
h1{font-size:1.4em;margin:0 0 8px}h2{font-size:1.05em;margin:2em 0 .6em;color:#ffcc00}
.info{color:#aaa;font-size:.9em}
.filter{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:12px 0}
select,button,input{font:inherit;background:#222;color:#eee;border:1px solid #444;border-radius:6px;padding:6px 10px}
button{cursor:pointer}button:hover{border-color:#888}
.klipp{display:flex;flex-wrap:wrap;gap:8px}
.k{display:flex;flex-wrap:wrap;align-items:center;gap:8px;max-width:100%;box-sizing:border-box;background:#1b1b1b;border:1px solid #2c2c2c;border-radius:8px;padding:6px 10px}
.k.vald{border-color:#ffcc00;background:#2a2510}
.k.fel{border-color:#e05050;background:#2a1414}
.k .flagga{display:flex;align-items:center;gap:4px;color:#e88;font-size:.8em;cursor:pointer;min-width:0}
.k .flagga input{width:16px;height:16px;accent-color:#e05050}
.k label{display:flex;align-items:center;gap:8px;cursor:pointer;min-width:190px}
.k input{width:20px;height:20px;accent-color:#ffcc00}
.nr{font-weight:700;font-variant-numeric:tabular-nums;color:#ffcc00}
.om{color:#bbb;font-size:.85em}
audio{height:32px;width:220px}
.val{position:fixed;left:0;right:0;bottom:0;background:#1a1a1a;border-top:2px solid #ffcc00;padding:10px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.val input{flex:1;min-width:200px;font-family:ui-monospace,monospace}
.val .rad{display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:100%}
.val .felrad span{color:#e88}
.tom{color:#888}
.hord{color:#5c5;font-size:.8em;white-space:nowrap;min-width:5.5em}
.k.lyssnad{border-left:4px solid #3a3}
.langd{font-variant-numeric:tabular-nums;font-size:.95em;min-width:3.6em;text-align:right;color:#ccc}
.langd.lang{color:#ff9800;font-weight:700}
h1.grupp{font-size:1.5em;margin:1.6em 0 .2em;padding:6px 10px;background:#ffcc00;color:#111;border-radius:6px}
</style></head><body>
<h1>Röstbibliotek</h1>
<p class="info" id="info">Laddar…</p>
<div class="filter">
  <label>Röst <select id="fRost"><option value="">Alla</option></select></label>
  <label>Modell <select id="fModell"><option value="">Alla</option></select></label>
  <label><input type="checkbox" id="fValda"> Bara valda</label>
  <label><input type="checkbox" id="fDoljFel"> Dölj de som ska göras om</label>
  <label><input type="checkbox" id="fOhorda"> Bara de jag inte lyssnat på</label>
  <label><input type="checkbox" id="fLangst"> Visa även för långa och avhuggna <span id="antalLanga"></span></label>
  <label><input type="checkbox" id="fBort"> Visa borttagna <span id="antalBort"></span></label>
  <label><input type="checkbox" id="fGodkanda"> Visa godkända <span id="antalGodkanda"></span></label>
  <span class="info">Kortast först. För långa klipp (mycket längre än de andra med samma fras – läser oftast upp stilen) är dolda.
    Visas de är tiden <span style="color:#ff9800;font-weight:700">orange</span>.</span>
  <span class="info" id="antalHorda"></span>
</div>
<div id="lista"></div>
<div class="val">
  <div class="rad">
    <span id="antal">0 valda</span>
    <input id="koder" readonly placeholder="Kryssa i klipp – numren hamnar här">
    <button id="kopiera">Kopiera</button>
    <button id="rensa">Rensa</button>
  </div>
  <div class="rad felrad">
    <span id="antalFel">0 att göra om</span>
    <input id="felkoder" placeholder="Skriv eller ta bort nummer – listan följer med kryssen">
    <button id="kopieraFel">Kopiera</button>
    <button id="rensaFel">Rensa</button>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let valda = new Set();
try { valda = new Set(JSON.parse(localStorage.getItem('rostval') || '[]')); } catch (e) {}
let fel = new Set();   // klipp som låter fel (läser upp stilen, säger fel tal …)
try { fel = new Set(JSON.parse(localStorage.getItem('rostfel') || '[]')); } catch (e) {}
let hord = new Set();  // klipp man spelat upp (markeras automatiskt)
try { hord = new Set(JSON.parse(localStorage.getItem('rosthord') || '[]')); } catch (e) {}
let klipp = [];
// Klippens längd i sekunder (läses från ljudfilernas början, sparas så det går fort nästa gång).
let langd = {};
try { langd = JSON.parse(localStorage.getItem('rostlangd') || '{}'); } catch (e) {}
let ritaIgen = null;   // ritar om (sorterar/döljer) när nya längder kommit in
const fmtLangd = (s) => s == null ? '…' : s.toFixed(1).replace('.', ',') + ' s';
/** Är klippet mycket längre än de andra med samma fras? (Rösten har kanske läst upp stilen.) */
/** Slutar klippet tvärt (troligen avhugget mitt i ett ord)? Mätt av Röstprov. */
const arAvhugget = (k) => typeof k.slut === 'number' && k.slut > -30;
/** Ska göras om av sig själv: för långt eller avhugget (inte de som redan är ersatta eller borttagna). */
let uttal = new Set();   // klipp med fel uttal (görs också om)
try { uttal = new Set(JSON.parse(localStorage.getItem('rostuttal') || '[]')); } catch (e) {}
let ejGorOm = new Set();   // automatiskt flaggade som man ändå godkänt (kryssat ur 'gör om')
try { ejGorOm = new Set(JSON.parse(localStorage.getItem('rostejgorom') || '[]')); } catch (e) {}
const autoGorOm = (k) => !k.bort && !k.ersatt && !valda.has(k.nr) && !ejGorOm.has(k.nr) && arLangt(k);
let avhugg = new Set();   // markerade som avhuggna själv
let ejAvhugg = new Set(); // mätningen sa avhugget, men man har kryssat ur
try { avhugg = new Set(JSON.parse(localStorage.getItem('rostavhugg') || '[]')); } catch (e) {}
try { ejAvhugg = new Set(JSON.parse(localStorage.getItem('rostejavhugg') || '[]')); } catch (e) {}
const arMarkeradAvhuggen = (k) => avhugg.has(k.nr) || (arAvhugget(k) && !ejAvhugg.has(k.nr) && !valda.has(k.nr));
function arLangt(k) {
  const s = langd[k.nr];
  if (s == null) return false;
  const andra = klipp.filter((o) => o.fras === k.fras && langd[o.nr] != null).map((o) => langd[o.nr]).sort((a, b) => a - b);
  if (andra.length < 4) return false;
  const median = andra[Math.floor(andra.length / 2)];
  return s > median * 1.45 && s > median + 2.0;
}
function visaLangd(fras) {
  document.querySelectorAll('.langd').forEach((el) => {
    const k = klipp.find((o) => o.nr === el.dataset.langd);
    if (!k || (fras && k.fras !== fras)) return;
    el.textContent = fmtLangd(langd[k.nr]);
    el.classList.toggle('lang', arLangt(k));
  });
}

function spara() {
  try { localStorage.setItem('rostval', JSON.stringify([...valda])); } catch (e) {}
  const lista = [...valda].sort();
  $('koder').value = lista.join(', ');
  $('antal').textContent = lista.length + (lista.length === 1 ? ' vald' : ' valda');
  try { localStorage.setItem('rostfel', JSON.stringify([...fel])); } catch (e) {}
  // Att göra om = de man markerat + för långa och avhuggna (inte ersatta eller borttagna).
  try { localStorage.setItem('rostuttal', JSON.stringify([...uttal])); } catch (e) {}
  try { localStorage.setItem('rostavhugg', JSON.stringify([...avhugg])); localStorage.setItem('rostejavhugg', JSON.stringify([...ejAvhugg])); } catch (e) {}
  const fl = [...new Set([...fel, ...uttal, ...klipp.filter((k) => autoGorOm(k) || arMarkeradAvhuggen(k)).map((k) => k.nr)])]
    .filter((nr) => { const k = klipp.find((x) => x.nr === nr); return k && !k.ersatt && !k.bort; }).sort((a, b) => a - b);
  $('felkoder').value = fl.join(', ');
  $('antalFel').textContent = fl.length + ' att göra om';
  try { localStorage.setItem('rosthord', JSON.stringify([...hord])); } catch (e) {}
  const finns = klipp.filter((k) => hord.has(k.nr)).length;
  $('antalHorda').textContent = `Lyssnat på ${finns} av ${klipp.length}`;
}

function rita() {
  const r = $('fRost').value, m = $('fModell').value, bara = $('fValda').checked, dolj = $('fDoljFel').checked, ohorda = $('fOhorda').checked;
  const visaLanga = $('fLangst').checked;
  const fraser = new Map();
  let doldaLanga = 0;
  for (const k of klipp) {
    if ((k.bort || k.ersatt || k.gorom) && !$('fBort').checked) continue;   // borttagna (verktyg/rostbort.txt) eller ersatta av ett nytt klipp
    if (k.godkand && !$('fGodkanda').checked) continue;   // redan godkända (verktyg/rostval.txt)
    if ((r && k.rost !== r) || (m && k.modell !== m) || (bara && !valda.has(k.nr)) || (dolj && (fel.has(k.nr) || uttal.has(k.nr) || arMarkeradAvhuggen(k))) || (ohorda && hord.has(k.nr))) continue;
    // För långa klipp döljs (utom valda, så man inte tappar bort något man kryssat i).
    if (!visaLanga && (arLangt(k) || arAvhugget(k)) && !valda.has(k.nr)) { doldaLanga++; continue; }
    if (!fraser.has(k.fras)) fraser.set(k.fras, []);
    fraser.get(k.fras).push(k);
  }
  $('antalLanga').textContent = `(${klipp.filter((k) => !k.bort && !k.ersatt && (arLangt(k) || arAvhugget(k))).length} st)`;
  $('antalBort').textContent = `(${klipp.filter((k) => k.bort || k.ersatt || k.gorom).length} st)`;
  $('antalGodkanda').textContent = `(${klipp.filter((k) => k.godkand).length} st)`;
  let html = '';
  // Kortast först inom varje fras; okänd längd sist.
  for (const lista of fraser.values()) lista.sort((a, b) => (langd[a.nr] ?? 1e9) - (langd[b.nr] ?? 1e9));
  // Rubriker: Fasta kommentarer, Böter, Skylten, 30-väg, 40-väg … (äldre klipp saknar grupp – gissas).
  const gruppAv = (k) => k.grupp || (k.fras.includes('kronor i böter') ? 'Böter' : k.fras.includes('CYKLA') ? 'Körkort' : k.fras.startsWith('Tack.') ? 'Tack' : 'Fasta kommentarer');
  const ordning = (g) => { const m = /^(\d+)-väg$/.exec(g); return m ? 100 + +m[1] : ({ 'Fasta kommentarer': 0, 'Körkort': 1, 'Tack': 2, 'Böter': 3, 'Skylten': 4, 'Tätort': 5, 'Snäll': 6, 'Snäll skylten': 7, 'Snäll tätort': 8, 'Snäll körkort': 9, 'Snäll tack': 10 }[g] ?? 99); };
  const poster = [...fraser].map(([fras, lista]) => [fras, lista, gruppAv(lista[0])])
    .map((p, i) => [...p, i]).sort((a, b) => ordning(a[2]) - ordning(b[2]) || a[3] - b[3]);
  let forra = null;
  for (const [fras, lista, grupp] of poster) {
    if (grupp !== forra) { html += `<h1 class="grupp">${esc(grupp)}</h1>`; forra = grupp; }
    html += `<h2>${esc(fras)}</h2><div class="klipp">`;
    for (const k of lista) {
      const v = valda.has(k.nr), f = fel.has(k.nr) || autoGorOm(k), h = hord.has(k.nr);
      html += `<div class="k${v ? ' vald' : ''}${f || uttal.has(k.nr) || arMarkeradAvhuggen(k) ? ' fel' : ''}${h ? ' lyssnad' : ''}" data-k="${esc(k.nr)}" title="${esc(k.stil ? 'Stil: ' + k.stil : 'Tempo: ' + k.tempo)}">
        <label><input type="checkbox" data-nr="${esc(k.nr)}"${v ? ' checked' : ''}>
        <span class="nr">${esc(k.nr)}</span>
        <span>${esc(k.rost)}<br><span class="om">${esc(k.modell)} · ${esc(k.skapad)}</span></span></label>
        <span class="langd${arLangt(k) ? ' lang' : ''}" data-langd="${esc(k.nr)}">${fmtLangd(langd[k.nr])}${arAvhugget(k) ? ' <b style="color:#e05050">avhugget?</b>' : ''}</span>
        <audio controls preload="${langd[k.nr] == null ? 'metadata' : 'none'}" src="${esc(k.fil)}"></audio>
        <span class="hord">${h ? '✓ lyssnad' : ''}</span>
        <label class="flagga" title="Klippet tar slut mitt i ett ord – spelas in igen"><input type="checkbox" data-avhugg="${esc(k.nr)}"${arMarkeradAvhuggen(k) ? ' checked' : ''}>avhugget</label>
        <label class="flagga" title="Fel uttal – spelas in igen"><input type="checkbox" data-uttal="${esc(k.nr)}"${uttal.has(k.nr) ? ' checked' : ''}>fel uttal</label>
        <label class="flagga" title="Spela in igen: läser upp stilen, huggs av …"><input type="checkbox" data-fel="${esc(k.nr)}"${f ? ' checked' : ''}>gör om</label></div>`;
    }
    html += '</div>';
  }
  $('lista').innerHTML = html || '<p class="tom">Inga klipp att visa.</p>';
}

$('lista').addEventListener('change', (e) => {
  const anr = e.target.dataset && e.target.dataset.avhugg;
  if (anr) {
    const k = klipp.find((x) => x.nr === anr);
    if (e.target.checked) { avhugg.add(anr); ejAvhugg.delete(anr); }
    else { avhugg.delete(anr); if (k && arAvhugget(k)) ejAvhugg.add(anr); }
    e.target.closest('.k').classList.toggle('fel', e.target.checked || fel.has(anr) || uttal.has(anr));
    spara();
    return;
  }
  const unr = e.target.dataset && e.target.dataset.uttal;
  if (unr) {
    if (e.target.checked) uttal.add(unr); else uttal.delete(unr);
    e.target.closest('.k').classList.toggle('fel', e.target.checked || fel.has(unr));
    spara();
    return;
  }
  const fnr = e.target.dataset && e.target.dataset.fel;
  if (fnr) {
    if (e.target.checked) { fel.add(fnr); ejGorOm.delete(fnr); } else { fel.delete(fnr); ejGorOm.add(fnr); }
    try { localStorage.setItem('rostejgorom', JSON.stringify([...ejGorOm])); } catch (err) {}
    e.target.closest('.k').classList.toggle('fel', e.target.checked);
    spara();
    return;
  }
  const nr = e.target.dataset && e.target.dataset.nr;
  if (!nr) return;
  if (e.target.checked) valda.add(nr); else valda.delete(nr);
  e.target.closest('.k').classList.toggle('vald', e.target.checked);
  spara();
});
// Bara ett klipp spelas åt gången.
document.addEventListener('play', (e) => {
  document.querySelectorAll('audio').forEach((a) => { if (a !== e.target) a.pause(); });
  // Markera klippet som lyssnat så fort det spelas upp.
  const kort = e.target.closest && e.target.closest('.k');
  if (kort && !hord.has(kort.dataset.k)) {
    hord.add(kort.dataset.k);
    kort.classList.add('lyssnad');
    kort.querySelector('.hord').textContent = '✓ lyssnad';
    spara();
  }
}, true);
// Längden blir känd när filens början laddats.
let sparaLangd = null;
document.addEventListener('loadedmetadata', (e) => {
  const kort = e.target.closest && e.target.closest('.k');
  const d = e.target.duration;
  if (!kort || !isFinite(d)) return;
  const nr = kort.dataset.k;
  if (langd[nr] === d) return;
  langd[nr] = d;
  const k = klipp.find((o) => o.nr === nr);
  visaLangd(k && k.fras);
  // Sortera om och dölj för långa när längderna kommit in – men aldrig mitt i en uppspelning.
  clearTimeout(ritaIgen);
  ritaIgen = setTimeout(() => {
    if ([...document.querySelectorAll('audio')].some((a) => !a.paused)) return;
    const y = window.scrollY; rita(); window.scrollTo(0, y);
  }, 800);
  clearTimeout(sparaLangd);
  sparaLangd = setTimeout(() => { try { localStorage.setItem('rostlangd', JSON.stringify(langd)); } catch (err) {} }, 500);
}, true);
for (const id of ['fRost', 'fModell', 'fValda', 'fDoljFel', 'fOhorda', 'fLangst', 'fBort', 'fGodkanda']) $(id).addEventListener('change', rita);
function kopiera(knapp, ruta) {
  $(knapp).addEventListener('click', async () => {
    const t = $(ruta).value;
    try { await navigator.clipboard.writeText(t); } catch (e) { $(ruta).select(); document.execCommand('copy'); }
    $(knapp).textContent = 'Kopierat!';
    setTimeout(() => { $(knapp).textContent = 'Kopiera'; }, 1500);
  });
}
kopiera('kopiera', 'koder');
kopiera('kopieraFel', 'felkoder');
/** Gör om-raden går att ändra för hand: de nummer som står där ska göras om, inga andra. */
function sattGorOm(text) {
  const nya = new Set((text.match(/\d+/g) || []).map((n) => n.padStart(3, '0')).filter((nr) => klipp.some((k) => k.nr === nr && !k.ersatt && !k.bort)));
  for (const k of klipp) {
    const nr = k.nr;
    if (nya.has(nr)) { fel.add(nr); ejGorOm.delete(nr); }
    else { fel.delete(nr); uttal.delete(nr); avhugg.delete(nr); ejGorOm.add(nr); if (arAvhugget(k)) ejAvhugg.add(nr); }
  }
  try { localStorage.setItem('rostejgorom', JSON.stringify([...ejGorOm])); } catch (e) {}
  const y = window.scrollY; spara(); rita(); window.scrollTo(0, y);
}
$('felkoder').addEventListener('change', (e) => sattGorOm(e.target.value));
$('felkoder').addEventListener('keydown', (e) => { if (e.key === 'Enter') e.target.blur(); });
$('rensaFel').addEventListener('click', () => {
  if (!$('felkoder').value.trim() || !confirm('Töm listan med klipp att göra om?')) return;
  sattGorOm('');
});
$('rensa').addEventListener('click', () => {
  if (!valda.size || !confirm('Ta bort alla kryss?')) return;
  valda.clear(); spara(); rita();
});

fetch('bibliotek.json', { cache: 'no-store' }).then((r) => r.json()).then((b) => {
  klipp = b.klipp;
  for (const k of klipp) if (typeof k.sek === 'number') langd[k.nr] = k.sek;   // längd uträknad av Röstprov
  // Rutorna längst ner ska bara visa det som väntar: klipp som redan är godkända, dolda, ersatta
  // eller lagda för att göras om tas bort ur kryssen (de är redan omhändertagna).
  const klara = new Set(klipp.filter((k) => k.godkand || k.bort || k.ersatt || k.gorom).map((k) => k.nr));
  const finns = new Set(klipp.map((k) => k.nr));
  for (const s of [valda, fel, uttal, avhugg, ejGorOm]) for (const nr of [...s]) if (klara.has(nr) || !finns.has(nr)) s.delete(nr);
  try { localStorage.setItem('rostejgorom', JSON.stringify([...ejGorOm])); } catch (e) {}
  const unika = (f) => [...new Set(klipp.map(f))].sort();
  for (const v of unika((k) => k.rost)) $('fRost').insertAdjacentHTML('beforeend', `<option>${esc(v)}</option>`);
  for (const v of unika((k) => k.modell)) $('fModell').insertAdjacentHTML('beforeend', `<option>${esc(v)}</option>`);
  const senast = klipp.length ? klipp[klipp.length - 1].skapad : '–';
  $('info').textContent = `${klipp.length} klipp, nummer ${klipp[0] ? klipp[0].nr : '–'}–${klipp.length ? klipp[klipp.length - 1].nr : '–'}. Senaste körning ${senast} UTC. Kryssa i de klipp som ska användas och kopiera numren.`;
  spara(); rita();
}).catch(() => { $('info').textContent = 'Kunde inte läsa bibliotek.json.'; });
</script>
</body></html>
