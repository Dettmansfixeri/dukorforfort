# Bygger appen när koden ändras och lägger APK:n i releasen "app":
#   https://github.com/Dettmansfixeri/dukorforfort/releases/download/app/DuKorForFort.apk
# Releasen markeras INTE som "latest" – den platsen är hastighetsdatans.
#
# Secret (Settings → Secrets and variables → Actions):
#   APP_KEYSTORE_B64   signeringsnyckeln (debug.keystore) som base64, så att varje
#                      bygge signeras likadant och kan installeras över det förra.
name: App

on:
  push:
    branches: [main]
    paths: ["DuKorForFort/**", ".github/workflows/app.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency: app

jobs:
  bygg:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: DuKorForFort
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Signeringsnyckel
        env:
          KEYSTORE: ${{ secrets.APP_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "APP_KEYSTORE_B64 saknas"; exit 1; fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/signering.keystore"
          echo "DEBUG_KEYSTORE=$RUNNER_TEMP/signering.keystore" >> "$GITHUB_ENV"

      - name: Bygg och testa
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest --no-daemon
          VERSION=$(grep -oP 'versionName = "\K[0-9.]+' app/build.gradle.kts).$BUILD_NUMBER
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/DuKorForFort-$VERSION.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/DuKorForFort.apk"

      # Releasen raderas aldrig. Den nya filen (med versionen i namnet) läggs till bredvid de gamla,
      # så att webbsidans länk fungerar hela tiden – även om något steg nedan misslyckas.
      - name: Publicera APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view app >/dev/null 2>&1; then
            gh release create app --title "Appen" --notes "Senaste bygget av appen." \
              --target "$GITHUB_SHA" --latest=false
          fi
          gh release upload app "$RUNNER_TEMP/DuKorForFort-$VERSION.apk" --clobber

      # Lägger app-version.json på webbsidan så att knappen kan visa version och länka rätt
      # utan att fråga GitHubs API (som har en gräns per besökare).
      - name: Berätta för webbsidan
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          SIZE=$(stat -c %s "$RUNNER_TEMP/DuKorForFort-$VERSION.apk")
          cat > "$RUNNER_TEMP/app-version.json" <<EOF
          {"version":"$VERSION","url":"https://github.com/${GITHUB_REPOSITORY}/releases/download/app/DuKorForFort-$VERSION.apk","size":$SIZE,"built":"$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
          EOF
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set net:max-retries 2;
            set net:timeout 30;
            open -u \"$FTP_USERNAME\" --env-password ns8.inleed.net;
            put \"$RUNNER_TEMP/app-version.json\" -o app-version.json
          "

      # Först när webbsidan pekar på den nya filen: byt reservfilen (fast namn) och städa gamla versioner.
      # De två senaste versionerna sparas, så att en sida som laddats strax innan fortfarande fungerar.
      - name: Städa releasen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload app "$RUNNER_TEMP/DuKorForFort.apk" --clobber
          gh release edit app --title "Appen $VERSION" \
            --notes "Senaste bygget av appen, version $VERSION (${GITHUB_SHA::7})."
          gh release view app --json assets --jq '.assets[].name' \
            | grep -E '^DuKorForFort-[0-9.]+\.apk$' \
            | sort -t. -k3,3n | head -n -2 \
            | while read -r old; do gh release delete-asset app "$old" --yes; done
