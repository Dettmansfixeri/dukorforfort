# Bygger appen när koden ändras och lägger APK:n i releasen "app":
#   https://github.com/Dettmansfixeri/dukorforfort/releases/download/app/DuKorForFort.apk
# Releasen markeras INTE som "latest" – den platsen är hastighetsdatans.
#
# Secret (Settings → Secrets and variables → Actions):
#   APP_KEYSTORE_B64   signeringsnyckeln (debug.keystore) som base64, så att varje
#                      bygge signeras likadant och kan installeras över det förra.
name: App

on:
  push:
    branches: [main]
    paths: ["DuKorForFort/**", ".github/workflows/app.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency: app

jobs:
  bygg:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: DuKorForFort
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100   # historiken behövs för ändringslistan (commitarna sedan förra bygget)

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Signeringsnyckel
        env:
          KEYSTORE: ${{ secrets.APP_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "APP_KEYSTORE_B64 saknas"; exit 1; fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/signering.keystore"
          echo "DEBUG_KEYSTORE=$RUNNER_TEMP/signering.keystore" >> "$GITHUB_ENV"

      - name: Bygg och testa
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest --no-daemon
          VERSION=$(grep -oP 'versionName = "\K[0-9.]+' app/build.gradle.kts).$BUILD_NUMBER
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # Körs samma bygge om får filen ett eget namn (-r2 …), så att filen webben redan länkar till
          # aldrig skrivs över. Webben börjar länka till den nya först när den är uppladdad.
          APK="DuKorForFort-$VERSION.apk"
          if [ "$ATTEMPT" -gt 1 ]; then APK="DuKorForFort-$VERSION-r$ATTEMPT.apk"; fi
          echo "APK=$APK" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/$APK"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/DuKorForFort.apk"

      # Releasen raderas aldrig. Den nya filen (med versionen i namnet) läggs till bredvid de gamla,
      # så att webbsidans länk fungerar hela tiden – även om något steg nedan misslyckas.
      - name: Publicera APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view app >/dev/null 2>&1; then
            gh release create app --title "Appen" --notes "Senaste bygget av appen." \
              --target "$GITHUB_SHA" --latest=false
          fi
          # GitHub svarar ibland med serverfel: försök tre gånger. --clobber om ett halvt försök hann lägga upp filen
          # (webben länkar inte till den förrän nästa steg, så det är ofarligt).
          for i in 1 2 3; do
            gh release upload app "$RUNNER_TEMP/$APK" --clobber && exit 0
            echo "Försök $i misslyckades, väntar…"; sleep $((i * 20))
          done
          exit 1

      # Lägger app-version.json på webbsidan så att knappen kan visa version och länka rätt
      # utan att fråga GitHubs API (som har en gräns per besökare).
      - name: Berätta för webbsidan
        env:
          BEFORE: ${{ github.event.before }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          SIZE=$(stat -c %s "$RUNNER_TEMP/$APK")
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          # Vad som är nytt (visas i appens uppdateringsruta): punkterna ("- …") i commit-meddelandena
          # som ändrat appen, annars första raden. De 15 senaste versionerna sparas, så att den som
          # hoppat över några versioner ser allt nytt sedan sin egen.
          # Går något fel med listan publiceras appen ändå (utan lista); felet hamnar i fältet "fel".
          HEAD_MSG=$(git log -1 --format=%s 2>/dev/null || echo "Ny version")
          ERR=""
          # Commitarna i den här pushen som ändrat appen (mappen vi står i), ur git-historiken.
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then RANGE=("$BEFORE..$GITHUB_SHA")
          else RANGE=(-1 "$GITHUB_SHA"); fi
          git log --format='%x1e%B' "${RANGE[@]}" -- . > "$RUNNER_TEMP/commits.txt" 2>"$RUNNER_TEMP/git1.txt" \
            || ERR="git: $(head -c 300 "$RUNNER_TEMP/git1.txt")"
          NEW=$(jq -Rsc --arg v "$VERSION" --arg head "$HEAD_MSG" '
            [ split("\u001e")[] | select(test("\\S"))
              | [split("\n")[] | select(startswith("Co-Authored-By") | not)] as $l
              | [$l[] | select(startswith("- ")) | .[2:]] as $b
              | if ($b | length) > 0 then $b[] else ($l[0] // empty) end ]
            | if length == 0 then [$head] else . end
            | {v: $v, c: .}' "$RUNNER_TEMP/commits.txt" 2>"$RUNNER_TEMP/jq1.txt") || ERR="$ERR lista: $(head -c 300 "$RUNNER_TEMP/jq1.txt")"
          [ -n "$NEW" ] || NEW=$(jq -nc --arg v "$VERSION" --arg h "$HEAD_MSG" '{v: $v, c: [$h]}')
          # Förra listan från webbsidan (via FTP, så att ingen cache eller brandvägg ger en gammal eller ingen fil).
          OLD=""
          if lftp -c "set ftp:ssl-force true; set ftp:ssl-protect-data true; set net:max-retries 2; set net:timeout 30;
                open -u \"$FTP_USERNAME\" --env-password ns8.inleed.net; get app-version.json -o \"$RUNNER_TEMP/old.json\"" \
                2>"$RUNNER_TEMP/ftp1.txt"; then
            OLD=$(jq -c '.changes // []' "$RUNNER_TEMP/old.json" 2>/dev/null || true)
          else ERR="$ERR gammal: $(head -c 200 "$RUNNER_TEMP/ftp1.txt")"; fi
          [ -n "$OLD" ] || OLD='[]'
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/app/$APK"
          BUILT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if ! jq -n --arg version "$VERSION" --arg url "$URL" --argjson size "$SIZE" --arg built "$BUILT" \
              --argjson new "$NEW" --argjson old "$OLD" --arg fel "$ERR" \
              '{version: $version, url: $url, size: $size, built: $built,
                changes: (([$new] + ($old | map(select(.v != $version)))) | .[:15])}
               + (if $fel == "" then {} else {fel: $fel} end)' > "$RUNNER_TEMP/app-version.json" 2>"$RUNNER_TEMP/jq2.txt"; then
            echo "Kunde inte skriva listan: $(cat "$RUNNER_TEMP/jq2.txt")"
            echo "{\"version\":\"$VERSION\",\"url\":\"$URL\",\"size\":$SIZE,\"built\":\"$BUILT\"}" > "$RUNNER_TEMP/app-version.json"
          fi
          cat "$RUNNER_TEMP/app-version.json"
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set net:max-retries 2;
            set net:timeout 30;
            open -u \"$FTP_USERNAME\" --env-password ns8.inleed.net;
            put \"$RUNNER_TEMP/app-version.json\" -o app-version.json
          "

      # Först när webbsidan pekar på den nya filen: byt reservfilen (fast namn) och städa gamla versioner.
      # Filen webben nu länkar till tas aldrig bort, plus en till (så att en sida som laddats strax innan
      # fortfarande fungerar) – även om det här var en omkörning av ett äldre bygge.
      - name: Städa releasen
        # Appen är redan uppe här. Strular GitHub i städningen ska inte hela bygget räknas som misslyckat.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload app "$RUNNER_TEMP/DuKorForFort.apk" --clobber
          gh release edit app --title "Appen $VERSION" \
            --notes "Senaste bygget av appen, version $VERSION (${GITHUB_SHA::7})."
          gh release view app --json assets --jq '.assets[].name' \
            | grep -E '^DuKorForFort-[0-9.]+(-r[0-9]+)?\.apk$' \
            | grep -vxF "$APK" \
            | sort -V | head -n -1 \
            | while read -r old; do gh release delete-asset app "$old" --yes; done
