# Laddar upp webbsidan (mappen webb/) till Inleed via FTPS när något i webb/ ändras.
#
# Kräver secrets i repot (Settings → Secrets and variables → Actions):
#   FTP_SERVER     t.ex. dukorforfort.dettmansfixeri.se
#   FTP_USERNAME   hela namnet som det står i DirectAdmin, t.ex. namn@dukorforfort.dettmansfixeri.se
#   FTP_PASSWORD   FTP-kontots lösenord
# FTP-kontot ska ha sajtens mapp (public_html för dukorforfort.dettmansfixeri.se) som sin rot.
# Filer som tas bort från webb/ tas INTE bort från servern (så inget annat där råkar raderas).
name: Webbsida

on:
  push:
    branches: [main]
    paths: ["webb/**", ".github/workflows/webb.yml"]
  workflow_dispatch:

concurrency: webb

jobs:
  ladda-upp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Installera lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Ladda upp till Inleed
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:passive-mode true;
            set net:max-retries 2;
            set net:timeout 30;
            open -u \"$FTP_USERNAME\" --env-password \"$FTP_SERVER\";
            mirror --reverse --verbose --only-newer --exclude-glob .DS_Store ./webb/ ./
          "
