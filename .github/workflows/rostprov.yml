# Skapar röstprov med Googles röster och lägger dem i röstbiblioteket:
#   https://dukorforfort.dettmansfixeri.se/rostprov/
# Inga klipp raderas. Varje nytt klipp får nästa lediga löpnummer (001, 002 …),
# som aldrig återanvänds. Klippen laddas upp först, biblioteket sist.
# Körs bara med knappen "Run workflow" (Actions → Röstprov).
#
# Secret (Settings → Secrets and variables → Actions):
#   GOOGLE_TTS_KEY   API-nyckel från Google Cloud-projektet "dukorforfort",
#                    begränsad till Cloud Text-to-Speech API (Chirp).
#   GOOGLE_GEMINI_KEY API-nyckel bunden till tjänstekontot "rostprov" (roll Vertex AI User),
#                    begränsad till Agent Platform API (Gemini).
name: Röstprov

on:
  workflow_dispatch:
    inputs:
      roster:
        description: "Röster (kommatecken emellan)"
        default: "Achird,Algieba,Charon,Sadachbia,Aoede,Callirrhoe,Sulafat,Zephyr"
      modeller:
        description: "Modeller: chirp, gemini-flash, gemini-pro (tomt = inga nya klipp, bara uppdatera sidan)"
        required: false
        default: "gemini-pro"
      fraser:
        description: "Fraser (| emellan)"
        default: "Det här kostar dig ett tusen femhundra kronor i böter.|Det här kostar dig två tusen kronor i böter.|Det här kostar dig två tusen fyrahundra kronor i böter.|Det här kostar dig två tusen åttahundra kronor i böter.|Det här kostar dig tre tusen tvåhundra kronor i böter.|Det här kostar dig tre tusen sexhundra kronor i böter.|Det här kostar dig tre tusen tvåhundra kronor i böter. Plus busskort i minst två månader.|Det här kostar dig tre tusen sexhundra kronor i böter. Plus busskort i minst två månader.|Det här kostar dig fyra tusen kronor i böter. Plus busskort i minst två månader."
      stil:
        description: "Stilinstruktion (bara Gemini)"
        default: "Jämnt och ganska snabbt tempo hela meningen. Torr, irriterad och lite sarkastisk. Uttala kör som i att köra bil."
      tagningar:
        description: "Antal versioner per klipp (1–5)"
        default: "2"
      tempo:
        description: "Talhastighet för Chirp (1 = normal)"
        default: "1.1"

concurrency: rostprov

jobs:
  prov:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Installera ffmpeg (Gemini-ljud -> MP3)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # Biblioteket med alla tidigare klipp. 404 = finns inte än (börjar på 001).
      # Allt annat fel avbryter, så att numren aldrig börjar om av misstag.
      - name: Hämta röstbiblioteket
        run: |
          code=$(curl -s -o bibliotek.json -w '%{http_code}' -H 'Cache-Control: no-cache' \
            "https://dukorforfort.dettmansfixeri.se/rostprov/bibliotek.json?t=$(date +%s)")
          if [ "$code" = 404 ]; then rm -f bibliotek.json; echo "Inget bibliotek än – börjar med de 96 gamla klippen (001–096)";
          elif [ "$code" != 200 ]; then echo "Kunde inte hämta biblioteket (HTTP $code)"; exit 1; fi

      - name: Skapa röstprov
        env:
          BIBLIOTEK: bibliotek.json
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          GOOGLE_GEMINI_KEY: ${{ secrets.GOOGLE_GEMINI_KEY }}
          ROSTER: ${{ inputs.roster }}
          MODELLER: ${{ inputs.modeller }}
          FRASER: ${{ inputs.fraser }}
          STIL: ${{ inputs.stil }}
          TAGNINGAR: ${{ inputs.tagningar }}
          TEMPO: ${{ inputs.tempo }}
        run: node verktyg/rostprov.mjs

      - name: Spara som nedladdning också
        uses: actions/upload-artifact@v4
        with:
          name: rostprov
          path: ut/

      - name: Lägg upp på webbsidan
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set net:max-retries 2;
            set net:timeout 30;
            open -u \"$FTP_USERNAME\" --env-password ns8.inleed.net;
            mkdir -pf rostprov/ljud;
            mirror --reverse ./ut/ljud/ ./rostprov/ljud/;
            put ./ut/index.html -o rostprov/index.html;
            put ./ut/bibliotek.json -o rostprov/bibliotek.json
          "
          echo "Lyssna: https://dukorforfort.dettmansfixeri.se/rostprov/" >> "$GITHUB_STEP_SUMMARY"
