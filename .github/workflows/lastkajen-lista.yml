# Listar vilka datapaket som finns på Trafikverkets Lastkajen (inget laddas ner).
# Resultatet läggs på webbsidan: https://dukorforfort.dettmansfixeri.se/dev/lastkajen.txt
name: Lastkajen-lista

on:
  push:
    branches: [main]
    paths: [verktyg/lista-lastkajen.mjs, .github/workflows/lastkajen-lista.yml]
  workflow_dispatch:

jobs:
  lista:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Lista paketen
        env:
          LASTKAJEN_USER: ${{ secrets.LASTKAJEN_USER }}
          LASTKAJEN_PASSWORD: ${{ secrets.LASTKAJEN_PASSWORD }}
        run: node verktyg/lista-lastkajen.mjs > lastkajen.txt; cat lastkajen.txt
      - name: Lägg på webbsidan
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            open -u \"$FTP_USERNAME\" --env-password ns8.inleed.net;
            mkdir -pf dev;
            put ./lastkajen.txt -o dev/lastkajen.txt
          "
